<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Spaß!</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      background-color: #f0f9ff;
      background-image: radial-gradient(#bae6fd 2px, transparent 2px);
      background-size: 24px 24px;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #334155;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 25px 35px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 650px;
      width: 100%;
      border: 4px solid #38bdf8;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #0284c7;
      margin: 0 0 10px 0;
      font-size: 2.2rem;
    }

    .score-board {
      background: #fef08a;
      border: 3px dashed #facc15;
      padding: 10px 20px;
      border-radius: 50px;
      display: inline-block;
      font-size: 1.4rem;
      font-weight: bold;
      color: #854d0e;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 30px;
      margin-top: 20px;
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 8px 15px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .task span {
      letter-spacing: 2px;
    }

    input {
      width: 65px;
      height: 45px;
      font-size: 1.3rem;
      text-align: center;
      border: 3px solid #cbd5e1;
      border-radius: 10px;
      font-family: inherit;
      font-weight: bold;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
    }

    input.correct {
      background-color: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
    }

    input.wrong {
      background-color: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    .star {
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>✏️ Mathe-Trainingsblatt</h1>
      <div class="score-board">
        Punkte: <span id="score">0</span> / <span id="max-score">0</span> <span class="star">⭐</span>
      </div>
    </header>

    <div class="grid" id="math-grid"></div>
  </div>

  <script>
    const problems = [
      { a: 11, b: 8 }, { a: 18, b: 9 },
      { a: 14, b: 6 }, { a: 15, b: 9 },
      { a: 17, b: 8 }, { a: 16, b: 9 },
      { a: 17, b: 9 }, { a: 13, b: 7 },
      { a: 11, b: 3 }, { a: 15, b: 8 },
      { a: 16, b: 8 }, { a: 13, b: 4 },
      { a: 12, b: 3 }, { a: 13, b: 9 },
      { a: 16, b: 7 }, { a: 11, b: 5 },
      { a: 13, b: 5 }, { a: 11, b: 2 },
      { a: 11, b: 7 }, { a: 14, b: 7 },
      { a: 12, b: 6 }, { a: 14, b: 5 },
      { a: 12, b: 5 }, { a: 15, b: 7 },
      { a: 14, b: 9 }, { a: 13, b: 8 },
      { a: 11, b: 4 }, { a: 12, b: 7 },
      { a: 11, b: 9 }, { a: 14, b: 8 }
    ];

    const happyPhrases = [
      "Juhuu!", "Yippie yeah!", "Gut gemacht!", 
      "Yes!", "Well done!", "Supi!"
    ];

    const sadPhrases = [
      "Dumm gelaufen!", "Das war daneben!", 
      "Knapp daneben!", "Leider falsch!", "Versuchs noch mal!"
    ];

    let solvedTasks = new Set();
    document.getElementById('max-score').textContent = problems.length;
    const gridEl = document.getElementById('math-grid');

    // Sprachausgabe-Funktion
    function speak(text) {
      window.speechSynthesis.cancel(); // Vorherige Sprachausgabe abbrechen
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.pitch = 1.2; // Etwas höher für eine freundlichere Stimme
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // Raster dynamisch aufbauen
    problems.forEach((p, index) => {
      const taskDiv = document.createElement('div');
      taskDiv.className = 'task';
      
      const label = document.createElement('span');
      label.textContent = `${p.a} - ${p.b} =`;
      
      const input = document.createElement('input');
      input.type = 'number';
      const correctAns = p.a - p.b;

      // Event-Listener für sofortige Prüfung bei der Eingabe
      input.addEventListener('input', () => {
        const val = input.value.trim();

        if (val === "") {
          input.className = "";
          if (solvedTasks.has(index)) {
            solvedTasks.delete(index);
            updateScore();
          }
          return;
        }

        const userAns = parseInt(val, 10);

        if (userAns === correctAns) {
          if (!input.classList.contains('correct')) {
            input.className = 'correct';
            speak(getRandomItem(happyPhrases));
            solvedTasks.add(index);
            updateScore();
          }
        } else {
          // Zeige "Falsch" erst, wenn die Zahlenlänge gleich oder länger als die Antwort ist
          if (val.length >= correctAns.toString().length) {
            if (!input.classList.contains('wrong')) {
              input.className = 'wrong';
              speak(getRandomItem(sadPhrases));
            }
            if (solvedTasks.has(index)) {
              solvedTasks.delete(index);
              updateScore();
            }
          } else {
            input.className = "";
          }
        }
      });
      
      taskDiv.appendChild(label);
      taskDiv.appendChild(input);
      gridEl.appendChild(taskDiv);
    });

    function updateScore() {
      document.getElementById('score').textContent = solvedTasks.size;
    }
  </script>
</body>
</html>
